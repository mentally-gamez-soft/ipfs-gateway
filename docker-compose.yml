version: '3.8'

services:
  # PostgreSQL database for development
  postgres:
    image: postgres:15-alpine
    container_name: ipfs-gateway-postgres
    environment:
      POSTGRES_DB: ipfs_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipfs-gateway-network

  # Redis for Celery broker and result backend
  redis:
    image: redis:7-alpine
    container_name: ipfs-gateway-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ipfs-gateway-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ipfs-gateway-network:
    driver: bridge

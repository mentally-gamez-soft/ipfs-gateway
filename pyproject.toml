[project]
name = "ipfs-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pip==25.3",
    "pre-commit==4.5.1",
    "Flask==3.0.0",
    "python-dotenv==1.0.1",
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
    "SQLModel==0.0.16",
    "alembic==1.13.1",
    "sqlalchemy>=2.0.25,<2.1",
    "faker==22.0.0",
    "psycopg2-binary==2.9.10",
    "boto3==1.34.122",
    "tenacity==9.0.0",
    "pybreaker==1.4.1",
    "vcrpy==5.1.0",
    "pytest-vcr==1.0.2",
    "arrow>=1.4.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "Pillow==11.0.0",
]

[tool.pytest.ini_options]
filterwarnings =  [
    'ignore::DeprecationWarning',
]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["core"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
